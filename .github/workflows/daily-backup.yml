name: Daily Database Backup to Google Drive

on:
  schedule:
    # Runs every day at 02:00 Israel time (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  backup:
    name: Backup Confettix DB → Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger backup API
        run: |
          echo "🚀 Starting daily backup..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "x-backup-secret: ${{ secrets.BACKUP_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/admin/backup")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Backup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Parse and display summary
          FILE_NAME=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('file_name','?'))" 2>/dev/null || echo "unknown")
          SIZE_KB=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('size_kb','?'))" 2>/dev/null || echo "?")

          echo "✅ Backup complete!"
          echo "📄 File: $FILE_NAME"
          echo "📦 Size: ${SIZE_KB} KB"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Daily backup FAILED at $(date)"
          echo "Check logs in GitHub Actions for details."
